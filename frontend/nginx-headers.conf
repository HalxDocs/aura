# Security + policy headers, included from every location that emits its own
# add_header (nginx drops inherited add_header directives the moment a
# location defines any of its own). Server-level include covers plain static
# responses; /assets/ and / include it explicitly for their cache headers.
#
# CSP allowlist — exactly what the SPA actually contacts:
#   fonts.googleapis.com        Google Fonts stylesheet (@import in index.css)
#   fonts.gstatic.com           the woff2 files that stylesheet references
#   *.ingest.de.sentry.io       Sentry event envelopes; *.ingest.sentry.io kept
#                               alongside so a DSN region move can't silently
#                               stop error reporting
#   wss://*.livekit.cloud       LiveKit WebRTC signaling — wildcard because the
#                               room subdomain is env-configured (LIVEKIT_URL)
#                               and can change independently of this file; a
#                               hardcoded host would break every voice
#                               interview with a CSP violation on a project move
#   lh3.googleusercontent.com / avatars.githubusercontent.com  OAuth avatars
#   blob:                       interview recordings playback (media) and
#                               MediaRecorder/LiveKit internals (worker)
# Everything else falls back to default-src 'self' and is blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; media-src 'self' blob:; connect-src 'self' wss://*.livekit.cloud https://*.ingest.de.sentry.io https://*.ingest.sentry.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Caddy terminates TLS in front of this container; this header passes through
# and only takes effect for the browser's HTTPS request.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Mic and camera stay same-origin-only (the voice interview needs them);
# everything not listed is denied by default.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
