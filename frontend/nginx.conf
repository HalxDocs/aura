server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress on the way out. The Vite bundle is one large JS file served
    # uncompressed otherwise (measured 1.2 MB; gzip brings it to roughly a
    # third of that on the wire).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;

    # API: proxy to FastAPI. No cache policy here — responses manage their own.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the proto Caddy saw (https); $scheme would downgrade it
        # to http on the internal hop and corrupt OAuth redirect URI generation.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Must cover the largest body the backend accepts: interview recordings
        # (MAX_AUDIO_SIZE = 25 MB in api/main.py). nginx 413s smaller values
        # before the request ever reaches FastAPI.
        client_max_body_size 25M;
    }

    # Hashed build assets: content-addressed filenames, so cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell (and every client route): always revalidate so a deploy is
    # picked up immediately; etag/last-modified make that cheap.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
